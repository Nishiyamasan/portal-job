name: "Build and Push Docker Image"

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # GitHubの画面からブランチを選択して実行できるようになります

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 # 自動的に選択されたブランチがチェックアウトされます

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/nishiyamasan/portal-job-backend:latest
            ghcr.io/nishiyamasan/portal-job-backend:${{ github.sha }}

      - name: Build and push Go API
        uses: docker/build-push-action@v5
        with:
          context: ./go-api
          push: true
          tags: |
            ghcr.io/nishiyamasan/portal-job-go-api:latest
            ghcr.io/nishiyamasan/portal-job-go-api:${{ github.sha }}

